<!DOCTYPE html>
<html lang="pt-BR">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sistema de Agendamento de Tarefas</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="css/style.css">

</head>

<body class="d-flex flex-column min-vh-100">
	<header class="bg-dark text-white py-3">
		<div class="container">
			<h1 class="h4 mb-0">Sistema de Agendamento de Tarefas</h1>
		</div>
	</header>

	<main class="container my-4 flex-grow-1">
		<div class="card">
			<div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
				<button class="btn btn-sm btn-outline-secondary" id="mesAnterior" aria-label="Mês anterior">&lt;</button>
				<span class="fw-semibold" id="mesAno">Agosto 2026</span>
				<div class="d-flex gap-2">
					<button class="btn btn-sm btn-outline-primary" id="btnAbrirPainel" aria-controls="painelTarefas">Tarefas do dia</button>
					<button class="btn btn-sm btn-primary" id="btnNovaTarefaTopo">+ Nova tarefa</button>
					<button class="btn btn-sm btn-outline-secondary" id="mesProximo" aria-label="Próximo mês">&gt;</button>
				</div>
			</div>
			<div class="card-body">
				<div id="calendario">Calendário será renderizado aqui</div>
			</div>
		</div>
	</main>

	<footer class="bg-dark text-white py-3 mt-auto">
		<div class="container">
			<small>Luann Silva Maia e Matheus Henrique Coitinho Loss</small>
		</div>
	</footer>

	<div class="offcanvas offcanvas-end" tabindex="-1" id="painelTarefas" aria-labelledby="tituloPainelTarefas" data-bs-scroll="false">
		<div class="painel-redimensionar" id="painelRedimensionar" role="separator" aria-orientation="vertical" aria-label="Redimensionar painel" tabindex="0"></div>
		<div class="offcanvas-header border-bottom">
			<div class="painel-cabecalho-texto">
				<h2 class="offcanvas-title h5 mb-0" id="tituloPainelTarefas">Tarefas do dia</h2>
				<small class="text-body-secondary" id="dataSelecionada"></small>
			</div>
			<button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Fechar painel"></button>
		</div>
		<div class="offcanvas-body">
			<button class="btn btn-primary w-100 mb-3" id="btnNovaTarefaPainel">+ Nova tarefa</button>
			<div id="listaTarefas"></div>
		</div>
	</div>

	<div class="modal fade" id="modalTarefa" tabindex="-1">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">

				<div class="modal-header">
					<h5 class="modal-title" id="tituloModal">Nova Tarefa</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
				</div>

				<div class="modal-body">
					<div class="mb-3">
						<label for="campoTitulo" class="form-label">Título</label>
						<input type="text" class="form-control" id="campoTitulo">
					</div>

					<div class="mb-3">
						<label for="campoDescricao" class="form-label">Descrição</label>
						<textarea class="form-control" id="campoDescricao" rows="2"></textarea>
					</div>

					<div class="mb-3">
						<label for="campoData" class="form-label">Data</label>
						<input type="date" class="form-control" id="campoData">
					</div>

					<div class="row">
						<div class="col-6 mb-3">
							<label for="campoHoraInicio" class="form-label">Início</label>
							<input type="time" class="form-control" id="campoHoraInicio">
						</div>

						<div class="col-6 mb-3">
							<label for="campoHoraFim" class="form-label">Término</label>
							<input type="time" class="form-control" id="campoHoraFim">
						</div>
					</div>

					<div class="alert alert-danger d-none" id="erroModal"></div>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
					<button type="button" class="btn btn-primary" id="btnSalvarTarefa">Salvar</button>
				</div>

			</div>

		</div>

	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script type="module" src="js/tarefas.js"></script>

</body>

</html>
