<!DOCTYPE html>
<html lang="pt-BR">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sistema de Agendamento de Tarefas</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="css/style.css">
	<link rel="icon" href="data: ,">

</head>

<body class="d-flex flex-column min-vh-100">
	<header class="bg-dark text-white py-3">
		<div class="container">
			<h1 class="h4 mb-0">Sistema de Agendamento de Tarefas</h1>
		</div>
	</header>

	<main class="container my-4 flex-grow-1">
		<div class="row g-3">

			<div class="col-12 col-md-8">
				<div class="card">
					<div class="card-header d-flex justify-content-between align-items-center">
						<button class="btn btn-sm btn-outline-secondary" id="mesAnterior">&lt;</button>
						<span id="mesAno">Agosto 2026</span>
						<div>
							<button class="btn btn-sm btn-primary" id="btnNovaTarefaTopo">+ Nova tarefa</button>
							<button class="btn btn-sm btn-outline-secondary" id="mesProximo">&gt;</button>
						</div>
					</div>
					<div class="card-body">
						<div id="calendario">Calendário será renderizado aqui</div>
					</div>
				</div>
			</div>

			<div class="col-12 col-md-4">
				<div class="card">
					<div class="card-header">
						<span id="dataSelecionada">Tarefas do dia</span>
					</div>
					<div class="card-body">
						<button class="btn btn-sm btn-primary mb-3" id="btnNovaTarefaPainel">+ Nova tarefa</button>
						<div id="listaTarefas">Lista de tarefas será renderizada aqui</div>
					</div>
				</div>
			</div>

		</div>
	</main>

	<footer class="bg-dark text-white py-3 mt-auto">
		<div class="container">
			<small>Luann Silva Maia e Matheus Henrique Coitinho Loss</small>
		</div>
	</footer>

	<div class="modal fade" id="modalTarefa" tabindex="-1">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">

				<div class="modal-header">
					<h5 class="modal-title" id="tituloModal">Nova Tarefa</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
				</div>

				<div class="modal-body">
					<div class="mb-3">
						<label for="campoTitulo" class="form-label">Título</label>
						<input type="text" class="form-control" id="campoTitulo">
					</div>

					<div class="mb-3">
						<label for="campoDescricao" class="form-label">Descrição</label>
						<textarea class="form-control" id="campoDescricao" rows="2"></textarea>
					</div>

					<div class="mb-3">
						<label for="campoData" class="form-label">Data</label>
						<input type="date" class="form-control" id="campoData">
					</div>

					<div class="row">
						<div class="col-6 mb-3">
							<label for="campoHoraInicio" class="form-label">Início</label>
							<input type="time" class="form-control" id="campoHoraInicio">
						</div>

						<div class="col-6 mb-3">
							<label for="campoHoraFim" class="form-label">Término</label>
							<input type="time" class="form-control" id="campoHoraFim">
						</div>
					</div>

					<div class="alert alert-danger d-none" id="erroModal"></div>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
					<button type="button" class="btn btn-primary" id="btnSalvarTarefa">Salvar</button>
				</div>

			</div>

		</div>

	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script  type="module" src="js/calendario.js"></script> <!--Adicionei o type=module p/ importar as funções do Storage.js-->
	<script type="module" src="js/modal.js"></script>

</body>

</html>
