<!DOCTYPE html>
<html lang="pt-BR">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sistema de Agendamento de Tarefas</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="css/style.css">

</head>

<body>
	<header class="bg-dark text-white py-3">
		<div class="container">
			<h1 class="h4 mb-0">Sistema de Agendamento de Tarefas</h1>
		</div>
	</header>

	<main class="container my-4">
		<div class="row g-3">

			<div class="col-12 col-md-8">
				<div class="card">
					<div class="card-header d-flex justify-content-between align-items-center">
						<button class="btn btn-sm btn-outline-secondary" id="mesAnterior">&lt;</button>
						<span id="mesAno">Agosto 2026</span>
						<div>
							<button class="btn btn-sm btn-primary" id="btnNovaTarefaTopo">+ Nova tarefa</button>
							<button class="btn btn-sm btn-outline-secondary" id="mesProximo">&gt;</button>
						</div>
					</div>
					<div class="card-body">
						<div id="calendario">Calendário será renderizado aqui</div>

					</div>
				</div>
			</div>

			<div <div class="col-12 col-md-4">
				<div class="card">
					<div class="card-header">
						<span id="dataSelecionada">Tarefas do dia</span>
					</div>
					<div class="card-body">
						<button class="btn btn-sm btn-primary mb-3" id="btnNovaTarefaPainel">+ Nova tarefa</button>
						<div id="listaTarefas">Lista de tarefas será renderizada aqui</div>
					</div>
				</div>
			</div>


		</div>
	</main>

	<footer class="bg-dark text-white py-3 mt-4">
		<div class="container">
			<small>Luann Silva Maia e Matheus Henrique Coitinho Loss</small>
		</div>
	</footer>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="js/storage.js"></script>
	<script src="js/calendario.js"></script>
	<script src="js/tarefas.js"></script>
	<script src="js/modal.js"></script>


</body>

</html>
